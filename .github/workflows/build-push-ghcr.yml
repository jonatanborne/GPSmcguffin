# Docker-image till GHCR. Checkout MED Git LFS så att ml/output/*.pkl är riktiga filer
# i build-kontexten (annars 503 på Railway/ML: "LFS-pekare"). Om jobbet failar på LFS-pull,
# kontrollera GitHub LFS-bandbredd/kvot eller bygg imagen lokalt efter `git lfs pull`.
# Railway: deploya från ghcr.io/.../gpsmcguffin:latest (inte bygga från repo utan LFS).

name: Build and push to GHCR

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify ML pickles are real files (not LFS pointers)
        run: |
          for f in ml/output/gps_correction_model_best.pkl ml/output/gps_correction_scaler.pkl; do
            if [ ! -f "$f" ]; then echo "Missing $f"; exit 1; fi
            if head -c 24 "$f" | grep -qF "version https://git-lfs"; then
              echo "ERROR: $f is still a Git LFS pointer — LFS fetch failed."
              exit 1
            fi
          done
          echo "OK: model files look like binary pickles."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpsmcguffin:latest
            ghcr.io/${{ github.repository_owner }}/gpsmcguffin:${{ github.sha }}

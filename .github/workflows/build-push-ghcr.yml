# Docker-image till GHCR. Vi checkar ut UTAN Git LFS – annars failar Actions ofta
# ("failed to fetch .../info/lfs") pga stora .pkl i LFS, kvot eller timeout.
# I imagen hamnar LFS-pekare för stora modeller; ML-endpoints kan svara 503 tills riktiga
# filer finns (samma mönster som Railway utan LFS – se backend load_pkl).
# Full ML-image: bygg Docker lokalt efter `git lfs pull`, eller lägg modell i Release och COPY/ARG.

name: Build and push to GHCR

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpsmcguffin:latest
            ghcr.io/${{ github.repository_owner }}/gpsmcguffin:${{ github.sha }}

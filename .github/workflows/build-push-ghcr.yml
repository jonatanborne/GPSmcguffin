# Bygg Docker-image med Git LFS ( .pkl ), pusha till GHCR.
# Railway stödjer inte LFS vid build – deploya från denna image istället.

name: Build and push to GHCR

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # checkout med lfs: true hämtar LFS-objekt; extra "git lfs pull" kan ge exit 2 / dubbel-fetch.
      # Om detta steget misslyckas: kör lokalt `git lfs push --all origin main` och kontrollera LFS-kvot (Billing).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpsmcguffin:latest
            ghcr.io/${{ github.repository_owner }}/gpsmcguffin:${{ github.sha }}
